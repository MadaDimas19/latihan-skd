cl=p=>[[8,8],[34,8],[34,34],[8,34]].map((c,k)=>`<rect x="${c[0]}" y="${c[1]}" width="18" height="18" fill="${k==p?N:'none'}" stroke="${N}"/>`).join(''),
dt=n=>[...Array(n).keys()].map(k=>`<circle cx="${14+k%3*16}" cy="${14+Math.floor(k/3)*16}" r="5" fill="${N}"/>`).join(''),
SH=[`<circle cx="30" cy="30" r="17" fill="${N}"/>`,`<rect x="14" y="14" width="32" height="32" fill="${N}"/>`,`<polygon points="30,12 48,46 12,46" fill="${N}"/>`,`<polygon points="30,10 50,30 30,50 10,30" fill="${N}"/>`],QF='Pilih gambar yang melengkapi pola berikut.';
const AN=[['Dokter','Rumah Sakit'],['Guru','Sekolah'],['Petani','Sawah'],['Hakim','Pengadilan'],['Nelayan','Laut'],['Montir','Bengkel'],['Kasir','Toko']],AL=[['Pisau','memotong'],['Pena','menulis'],['Palu','memukul'],['Sapu','membersihkan'],['Kunci','membuka'],['Jarum','menjahit'],['Timbangan','menimbang']],
SY=[['akurat','tepat','meleset'],['transparan','terbuka','tertutup'],['efisien','berdaya guna','boros'],['kompleks','rumit','sederhana'],['optimal','maksimal','minimal'],['mutakhir','terbaru','usang'],['fleksibel','luwes','kaku'],['valid','sahih','keliru'],['konsisten','taat asas','berubah-ubah'],['solid','kukuh','rapuh'],['inovatif','pembaru','kolot'],['produktif','berhasil guna','mandul']];
const an=(L,t)=>()=>{const p=shs(L).slice(0,5);return{q:`${p[0][0]} : ${p[0][1]} = ${p[1][0]} : ...`,ok:p[1][1],w:p.slice(2,5).map(x=>x[1]),ex:`Hubungan ${t}: ${p[0][0]} berkaitan dengan ${p[0][1]}, maka ${p[1][0]} berkaitan dengan ${p[1][1]}.`}};
const GX=[
()=>{const p=R(5,20),l=R(3,p-1),r=p*l;return{q:`Persegi panjang berukuran ${p} cm x ${l} cm. Luasnya (cm2) adalah`,ok:r,w:op(r,p),ex:`L = p x l = ${p} x ${l} = ${r}.`}},
()=>{const m=R(60,90),a=R(2,9),b=R(2,9),x=shs([m+a,m-a,m+b,m-b]);return{q:`Rata-rata dari ${x.join(', ')} adalah`,ok:m,w:op(m,2),ex:`Jumlah = ${m*4}, dibagi 4 = ${m}.`}},
()=>{const y=R(10,40),x=y+R(2,20),S=x+y,D=x-y;return{q:`Jumlah dua bilangan ${S} dan selisihnya ${D}. Bilangan terbesar adalah`,ok:x,w:op(x,2),ex:`Terbesar = (${S} + ${D}) / 2 = ${x}.`}},
an(AN,'pekerja dan tempat kerja'),an(AL,'alat dan fungsinya'),
()=>{const sy=pk([1,2]),p=shs(SY).slice(0,4);return{q:`${sy==1?'Sinonim':'Antonim'} kata "${p[0][0]}" adalah`,ok:p[0][sy],w:p.slice(1).map(x=>x[sy]),ex:`${p[0][0]} bermakna ${p[0][1]}; lawan katanya ${p[0][2]}.`}},
()=>{const s=pk(['pegawai','mahasiswa','atlet','guru','relawan']),b=pk(['disiplin','teliti','jujur','rajin','santun']),n=pk(['Andi','Sari','Budi','Rina']);return{q:`Semua ${s} ${b}. ${n} adalah ${s}. Kesimpulannya`,ok:`${n} ${b}`,w:[`${n} tidak ${b}`,`${n} mungkin ${b}`,`Semua yang ${b} adalah ${s}`],ex:`Silogisme: semua ${s} ${b} dan ${n} termasuk ${s}, maka ${n} ${b}.`}},
()=>{const d=pk([45,90,135]),r=pk([0,45,90,135,180,225,270,315]),f=k=>(r+d*k)%360,a=f(3),w=shs([45,90,135,180,270].map(x=>(a+x)%360)).slice(0,3);return{q:QF,fig:strip([0,1,2].map(k=>arw(f(k)))),ok:sv(arw(a)),w:w.map(x=>sv(arw(x))),ex:`Setiap gambar diputar ${d} derajat searah jarum jam dari gambar sebelumnya, sehingga gambar berikutnya menghadap ${a} derajat dari arah atas.`}},
()=>{const s=pk([1,3]),p=R(0,3),f=k=>(p+s*k)%4,a=f(3);return{q:QF,fig:strip([0,1,2].map(k=>cl(f(k)))),ok:sv(cl(a)),w:[0,1,2,3].filter(x=>x!=a).map(x=>sv(cl(x))),ex:`Kotak yang diarsir berpindah satu petak ${s==1?'searah':'berlawanan arah'} jarum jam pada setiap langkah.`}},
()=>{const a=R(1,2),d=R(1,2),z=a+3*d,w=[z-1,z+1,z-2,z+2].filter(x=>x>0&&x<10).slice(0,3);return{q:QF,fig:strip([0,1,2].map(k=>dt(a+d*k))),ok:sv(dt(z)),w:w.map(x=>sv(dt(x))),ex:`Jumlah lingkaran bertambah ${d} setiap langkah: ${a}, ${a+d}, ${a+2*d}, maka berikutnya ${z}.`}},
()=>{const L=pk([2,3]),o=shs(SH).slice(0,L),a=o[5%L];return{q:QF,fig:strip([0,1,2,3,4].map(k=>o[k%L])),ok:sv(a),w:SH.filter(x=>x!=a).map(x=>sv(x)),ex:`Bentuk berulang setiap ${L} gambar, sehingga gambar ke-6 sama dengan gambar ke-${5%L+1}.`}}];
const GT=[...G,...GX];
function gq(id){const k=+id.slice(1);rnd=mul(k*7919+13);const x=GT[k%GT.length]();rnd=Math.random;return{cat:'TIU',q:x.q,fig:x.fig,ok:String(x.ok),w:x.w.map(String),ex:x.ex}}
let S,Q,A,i,T,tid;
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(x){}
if(!S||!S.slots){S={slots:{},res:{},c:{},n:0};for(const c in REQ){const ids=sh(ALL.map((q,k)=>k).filter(k=>ALL[k].cat==c).concat(c=='TIU'?[...Array(NG).keys()].map(k=>'g'+k):[]));S.slots[c]=ids.slice(0,REQ[c]);S.res[c]=ids.slice(REQ[c])}}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}}
const pts=(q,a)=>{if(!a)return 0;if(q.cat=='TKP')return PT[[q.ok,...q.w].indexOf(a)];return a==q.ok?5:0};
const twice=(b,fn)=>{const t=b.textContent;b.onclick=()=>{if(b.dataset.s){fn();return}b.dataset.s=1;b.textContent='Ketuk lagi untuk konfirmasi';setTimeout(()=>{delete b.dataset.s;b.textContent=t},3000)}};
function home(){const rsv=Object.values(S.res).flat().length;
$.innerHTML=`<div class="hero"><span class="pill">Simulasi SKD</span><h1>Latihan SKD CPNS 2026</h1><p>110 soal, 100 menit, penilaian mengikuti sistem CAT BKN.</p></div><div class="c"><div class="st"><div><b>30</b><span>TWK</span></div><div><b>35</b><span>TIU</span></div><div><b>45</b><span>TKP</span></div></div><p class="mu" style="margin:0 0 12px">TWK dan TIU: benar 5, salah 0. TKP: nilai 1 sampai 5 sesuai pilihan. Ambang batas formasi umum: TWK 65, TIU 80, TKP 166. Soal dan pilihan diacak tiap sesi.</p><p class="mu">Sesi selesai: <b>${S.n}</b> &nbsp;|&nbsp; Soal cadangan: <b>${rsv}</b><br>Level ${Math.floor((S.xp||0)/200)+1} &nbsp;|&nbsp; XP ${S.xp||0} &nbsp;|&nbsp; Runtun terbaik ${S.best||0}</p><button class="b" id="go">Mulai Simulasi Ujian (110 soal)</button><div class="mu" style="margin:18px 0 6px"><b>Latihan Cepat</b> per subtes: 10 soal, langsung dibahas setiap jawaban, tanpa timer.</div><div class="nv"><button class="b s" data-p="TWK">TWK</button><button class="b s" data-p="TIU">TIU</button><button class="b s" data-p="TKP">TKP</button></div><div class="ex" style="margin-top:16px"><b>Cakupan materi (mengacu pada kisi-kisi SKD):</b><br>TWK: Nasionalisme, Integritas, Bela Negara, Pilar Negara, Bahasa Indonesia.<br>TIU: verbal, numerik, figural.<br>TKP: pelayanan publik, jejaring kerja, sosial budaya, TIK, profesionalisme, anti radikalisme.</div><button class="b s" id="rs">Reset Progres</button></div>`;
I('go').onclick=start;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>prac(b.dataset.p));twice(I('rs'),()=>{try{localStorage.removeItem(K)}catch(x){}load();home()})}
function build(){const out=[];
for(const c of ['TWK','TIU','TKP']){let a=S.slots[c].map(id=>({id,...(typeof id=='number'?ALL[id]:gq(id))}));
sh(a).forEach(q=>{q.o=sh([q.ok,...q.w]);out.push(q)})}
return out}
const upd=()=>{const t=I('tm');if(t){t.textContent=String(Math.floor(T/60)).padStart(2,'0')+':'+String(T%60).padStart(2,'0');t.className=T<300?'warn':''}};
function start(){Q=build();A=[];i=0;T=MIN*60;clearInterval(tid);tid=setInterval(()=>{T--;upd();if(T<=0)finish()},1000);show()}
function show(keep){const q=Q[i],y=scrollY;
$.innerHTML=`<div class="top"><b id="tm"></b><span class="mu">${A.filter(Boolean).length}/${Q.length} terjawab</span></div><div class="c"><span class="tag ${q.cat}">${q.cat}</span><span class="mu">Soal ${i+1} / ${Q.length}</span><h2 style="margin-top:10px">${e(q.q)}</h2>${q.fig||''}${q.o.map((o,k)=>`<button class="o ${A[i]===o?'sel':''}" data-k="${k}">${'ABCD'[k]}. ${e(o)}</button>`).join('')}<div class="nv"><button class="b s" id="pv" ${i?'':'disabled'}>Sebelumnya</button><button class="b" id="nx" ${i<Q.length-1?'':'disabled'}>Berikutnya</button></div></div><div class="c"><div class="gr">${Q.map((x,k)=>`<button class="g ${A[k]?'a':''} ${k==i?'cur':''}" data-j="${k}">${k+1}</button>`).join('')}</div><button class="b s" id="fn">Akhiri Ujian</button></div>`;
document.querySelectorAll('.o').forEach(b=>b.onclick=()=>{A[i]=q.o[+b.dataset.k];show(1)});
document.querySelectorAll('.g').forEach(b=>b.onclick=()=>{i=+b.dataset.j;show()});
I('pv').onclick=()=>{i--;show()};I('nx').onclick=()=>{i++;show()};
twice(I('fn'),finish);upd();scrollTo(0,keep?y:0)}
function finish(){clearInterval(tid);const sc={TWK:0,TIU:0,TKP:0};let sw=0;
Q.forEach((q,k)=>{const p=pts(q,A[k]);sc[q.cat]+=p;if(p==5&&q.id!=null)S.c[q.id]=(S.c[q.id]||0)+1});
for(const c in S.slots)S.slots[c]=S.slots[c].map(id=>{if((S.c[id]||0)>=2&&S.res[c].length){sw++;return S.res[c].shift()}return id});
S.n++;save();
const tot=sc.TWK+sc.TIU+sc.TKP,lulus=Object.keys(PG).every(c=>sc[c]>=PG[c]),used=Math.max(0,MIN*60-T);
const it=(q,k)=>{const p=pts(q,A[k]),t=p==5;return`<div class="c r ${t?'ok':''}" data-c="${q.cat}" data-t="${t?1:0}"><span class="tag ${q.cat}">${q.cat}</span><b>${t?'Benar':q.cat=='TKP'&&A[k]?'Poin '+p:'Salah'}</b> <span class="mu">Soal ${k+1}</span><p style="margin:8px 0">${e(q.q)}</p>${q.fig||''}<div class="ans ${t?'g':'x'}">Jawaban Anda: ${A[k]?e(A[k]):'(tidak dijawab)'}${q.cat=='TKP'?' ('+p+' poin)':''}</div>${t?'':`<div class="ans g">Jawaban terbaik: ${e(q.ok)}</div>`}${q.cat=='TKP'?`<div class="ex"><b>Nilai tiap pilihan:</b>${[q.ok,...q.w].map((o,j)=>`<div>[${PT[j]}] ${e(o)}</div>`).join('')}</div>`:''}<div class="ex"><b>Penjelasan:</b> ${e(q.ex)}</div></div>`};
$.innerHTML=`<div class="c" style="text-align:center"><div class="mu">Skor SKD</div><div class="big">${tot}</div><div class="mu">dari 550</div><p><span class="bd ${lulus?'y':'n'}">${lulus?'Memenuhi ambang batas':'Belum memenuhi ambang batas'}</span></p><div style="text-align:left">${Object.keys(PG).map(c=>{const ok=sc[c]>=PG[c];return`<div class="rw"><b>${c}</b> <span class="mu">${sc[c]} / ${MX[c]} (minimal ${PG[c]})</span><div class="bar" style="margin:4px 0 0"><i style="width:${sc[c]/MX[c]*100}%;background:${ok?'#12a574':'#e0503d'}"></i></div></div>`}).join('')}</div><p class="mu">Waktu terpakai ${Math.round(used/60)} menit.${sw?' '+sw+' soal sudah dikuasai (benar 2x) dan diganti soal cadangan.':''}</p><button class="b" id="ag">Ujian Lagi (diacak)</button><button class="b s" id="hm">Beranda</button></div><h2>Pembahasan</h2><div class="chips">${['ALL','SALAH','TWK','TIU','TKP'].map(f=>`<button class="ch" data-f="${f}">${f=='ALL'?'Semua':f=='SALAH'?'Belum 5 poin':f}</button>`).join('')}</div>`+Q.map(it).join('');
document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const f=b.dataset.f;document.querySelectorAll('.r').forEach(d=>d.style.display=(f=='ALL'||(f=='SALAH'&&d.dataset.t=='0')||d.dataset.c==f)?'':'none')});
I('ag').onclick=start;I('hm').onclick=home;scrollTo(0,0)}
let ST=0,BS=0,XP=0;
function mast(){let sw=0;Q.forEach((q,k)=>{if(q.id!=null&&pts(q,A[k])==5)S.c[q.id]=(S.c[q.id]||0)+1});for(const c in S.slots)S.slots[c]=S.slots[c].map(id=>{if((S.c[id]||0)>=2&&S.res[c].length){sw++;return S.res[c].shift()}return id});return sw}
function prac(c){clearInterval(tid);Q=sh(S.slots[c]).slice(0,10).map(id=>{const q={id,...(typeof id=='number'?ALL[id]:gq(id))};q.o=sh([q.ok,...q.w]);return q});A=[];i=0;ST=0;BS=0;XP=0;pshow()}
function pshow(){const q=Q[i],a=A[i],d=a!=null;
$.innerHTML=`<div class="top"><b>${i+1} / ${Q.length}</b><span class="mu">Runtun benar: <b>${ST}</b> &nbsp;|&nbsp; XP: <b>${XP}</b></span></div><div class="c"><span class="tag ${q.cat}">${q.cat}</span><span class="mu">Latihan Cepat</span><h2 style="margin-top:10px">${e(q.q)}</h2>${q.fig||''}${q.o.map((o,k)=>`<button class="o ${d?(o===q.ok?'ok':o===a?'no':''):''}" data-k="${k}" ${d?'disabled':''}>${'ABCD'[k]}. ${e(o)}</button>`).join('')}${d?`<div class="ex"><b>${pts(q,a)==5?'Tepat.':'Pembahasan:'}</b> ${q.cat=='TKP'?'Poin Anda '+pts(q,a)+' dari 5. ':''}${e(q.ex)}</div><button class="b" id="pn" style="margin-top:12px">${i<Q.length-1?'Soal Berikutnya':'Lihat Hasil'}</button>`:''}</div>`;
document.querySelectorAll('.o').forEach(b=>b.onclick=()=>{A[i]=q.o[+b.dataset.k];const p=pts(q,A[i]);if(p==5){ST++;BS=Math.max(BS,ST);XP+=10}else{ST=0;if(q.cat=='TKP')XP+=p*2}pshow()});
if(d)I('pn').onclick=()=>{if(i<Q.length-1){i++;pshow()}else pfin()};scrollTo(0,0)}
function pfin(){const b=Q.filter((q,k)=>pts(q,A[k])==5).length,sw=mast(),pc=b/Q.length*100,c=Q[0].cat;S.xp=(S.xp||0)+XP;S.best=Math.max(S.best||0,BS);save();
$.innerHTML=`<div class="c" style="text-align:center"><div class="mu">Hasil Latihan ${c}</div><div class="big">${b}<span style="font-size:1.4rem"> / ${Q.length}</span></div><p>${pc>=80?'Sangat baik. Pertahankan.':pc>=60?'Cukup baik. Pelajari lagi pembahasan soal yang belum tepat.':'Perlu penguatan. Ulangi latihan setelah membaca pembahasan.'}</p><p class="mu">XP didapat: <b>${XP}</b> | Runtun terbaik: <b>${BS}</b>${sw?' | '+sw+' soal dikuasai dan diganti':''}</p><button class="b" id="pa">Latihan Lagi</button><button class="b s" id="ph">Beranda</button></div>`;
I('pa').onclick=()=>prac(c);I('ph').onclick=home;scrollTo(0,0)}
load();home();
</script></body></html>
